# .github/workflows/rdpfree.yml
name: RdpFree — RDP/SSH 6 Jam

on:
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: Durasi sesi dalam menit. 6 jam = 360
        required: false
        default: "360"
        type: choice
        options: ["15", "30", "60", "120", "180", "240", "300", "330", "360"]

      hostname:
        description: Hostname sesi
        required: false
        default: rdpfree
        type: string

      rdp_user:
        description: Username Linux/RDP/SSH
        required: false
        default: xyadmin
        type: string

      akses:
        description: Akses Tailscale privat
        required: false
        default: tailscale
        type: choice
        options:
          - tailscale

      runner:
        description: Sistem operasi runner
        required: false
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04
          - windows-2022
          - windows-2025
          - windows-latest

      desktop:
        description: Desktop Linux
        required: false
        default: xfce
        type: choice
        options:
          - xfce
          - mate
          - lxde
          - tidak

      microphone:
        description: Izinkan mikrofon melalui RDP
        required: false
        default: tidak
        type: choice
        options:
          - ya
          - tidak

      ssh:
        description: Aktifkan SSH
        required: false
        default: ya
        type: choice
        options:
          - ya
          - tidak

      xrdp:
        description: Aktifkan koneksi RDP pada Linux
        required: false
        default: ya
        type: choice
        options:
          - ya
          - tidak

permissions:
  contents: write
  actions: read

concurrency:
  group: xyrdp
  cancel-in-progress: false

jobs:
  linux:
    name: Linux RDP/SSH
    if: startsWith(inputs.runner, 'ubuntu-')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      DUR: ${{ inputs.durasi_menit }}
      HOSTNAME: ${{ inputs.hostname }}
      RDP_USER: ${{ inputs.rdp_user }}
      DESKTOP: ${{ inputs.desktop }}
      MICROPHONE: ${{ inputs.microphone }}
      ENABLE_SSH: ${{ inputs.ssh }}
      ENABLE_XRDP: ${{ inputs.xrdp }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Informasi runner Linux
        shell: bash
        run: |
          set -e
          echo "[RdpFree] OS:"
          uname -a
          echo "[RdpFree] Hostname: $HOSTNAME"
          echo "[RdpFree] User: $RDP_USER"
          echo "[RdpFree] Disk:"
          df -h

      - name: Install Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_AUTH_KEY }}
          statedir: /tmp/tailscale-state

      - name: Tailscale hostname
        shell: bash
        run: |
          set -e

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "::error::Secret TAILSCALE_AUTHKEY atau TAILSCALE_AUTH_KEY belum dibuat."
            exit 1
          fi

          sudo tailscale set --hostname="${HOSTNAME}" || \
          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="${HOSTNAME}" \
            --accept-routes=false \
            --accept-dns=true

          echo "[RdpFree] Tailscale status:"
          tailscale status

          TS_IP="$(tailscale ip -4 | head -n 1)"
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Setup user Linux
        shell: bash
        run: |
          set -e

          if ! [[ "$RDP_USER" =~ ^[a-zA-Z0-9_-]{3,20}$ ]]; then
            echo "::error::Nama user hanya boleh berisi huruf, angka, _ atau - dengan panjang 3-20 karakter."
            exit 1
          fi

          if ! id "$RDP_USER" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$RDP_USER"
          fi

          sudo usermod -aG sudo "$RDP_USER"

          if [ -n "${{ secrets.RDP_PASSWORD }}" ]; then
            echo "${RDP_USER}:${{ secrets.RDP_PASSWORD }}" | sudo chpasswd
          else
            echo "::error::Secret RDP_PASSWORD belum dibuat."
            exit 1
          fi

          sudo mkdir -p "/home/$RDP_USER"
          sudo chown -R "$RDP_USER:$RDP_USER" "/home/$RDP_USER"

      - name: Install desktop XFCE
        if: ${{ inputs.desktop == 'xfce' }}
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils

      - name: Install desktop MATE
        if: ${{ inputs.desktop == 'mate' }}
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ubuntu-mate-desktop \
            dbus-x11

      - name: Install desktop LXDE
        if: ${{ inputs.desktop == 'lxde' }}
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxde \
            dbus-x11

      - name: Configure desktop session
        if: ${{ inputs.desktop != 'tidak' }}
        shell: bash
        run: |
          set -e

          case "$DESKTOP" in
            xfce)
              SESSION="startxfce4"
              ;;
            mate)
              SESSION="mate-session"
              ;;
            lxde)
              SESSION="startlxde"
              ;;
            *)
              SESSION="startxfce4"
              ;;
          esac

          sudo tee "/home/$RDP_USER/.xsession" >/dev/null <<EOF
          #!/bin/sh
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          exec $SESSION
          EOF

          sudo chmod +x "/home/$RDP_USER/.xsession"
          sudo chown "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.xsession"

      - name: Install and configure XRDP
        if: ${{ inputs.xrdp == 'ya' && inputs.desktop != 'tidak' }}
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xrdp \
            xorgxrdp \
            dbus-x11

          sudo adduser xrdp ssl-cert || true

          sudo sed -i 's/^new_cursors=true/new_cursors=false/' /etc/xrdp/xrdp.ini || true
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow from 100.64.0.0/10 to any port 3389 proto tcp || true
          fi

      - name: Install and configure SSH
        if: ${{ inputs.ssh == 'ya' }}
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server

          sudo mkdir -p /run/sshd
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow from 100.64.0.0/10 to any port 22 proto tcp || true
          fi

      - name: Setup audio dan mikrofon
        if: ${{ inputs.microphone == 'ya' && inputs.desktop != 'tidak' }}
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pulseaudio \
            pulseaudio-utils \
            alsa-utils

          sudo usermod -aG audio "$RDP_USER" || true

      - name: Publish koneksi Linux
        shell: bash
        run: |
          set -e

          mkdir -p out

          cat > out/rdp-status.json <<EOF
          {
            "active": true,
            "platform": "linux",
            "hostname": "$HOSTNAME",
            "username": "$RDP_USER",
            "tailscale": {
              "ip": "$TAILSCALE_IP",
              "rdp_port": 3389,
              "ssh_port": 22
            },
            "desktop": "$DESKTOP",
            "xrdp": "$ENABLE_XRDP",
            "ssh": "$ENABLE_SSH",
            "duration_minutes": "$DUR"
          }
          EOF

          echo "========================================"
          echo "LINUX SESI SIAP"
          echo "========================================"
          echo "RDP   : $TAILSCALE_IP:3389"
          echo "SSH   : $RDP_USER@$TAILSCALE_IP"
          echo "User  : $RDP_USER"
          echo "Pass  : gunakan secret RDP_PASSWORD"
          echo "Desktop: $DESKTOP"
          echo "========================================"

      - name: Publish status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add out/rdp-status.json
          git commit -m "Update Linux RDP status" || true
          git push origin HEAD:status --force || true

      - name: Sesi aktif
        shell: bash
        run: |
          set -e
          END_TIME=$(( $(date +%s) + DUR * 60 ))

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            echo "[RdpFree] Sesi aktif - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            sleep 60
          done

      - name: Finalize Linux
        if: always()
        shell: bash
        run: |
          set +e

          sudo systemctl stop xrdp 2>/dev/null || true
          sudo systemctl stop ssh 2>/dev/null || true
          sudo tailscale logout 2>/dev/null || true

          mkdir -p out

          cat > out/rdp-status.json <<EOF
          {
            "active": false,
            "platform": "linux",
            "hostname": "$HOSTNAME",
            "message": "Sesi Linux telah selesai."
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/rdp-status.json
          git commit -m "Finalize Linux RDP session" || true
          git push origin HEAD:status --force || true

  windows:
    name: Windows RDP
    if: startsWith(inputs.runner, 'windows-')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      DUR: ${{ inputs.durasi_menit }}
      HOSTNAME: ${{ inputs.hostname }}
      RDP_USER: ${{ inputs.rdp_user || 'xyadmin' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Informasi Windows runner
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "[RdpFree] OS: $($os.Caption) build $($os.Version)"
          Write-Host "[RdpFree] Hostname: $env:HOSTNAME"

      - name: Setup dasar Windows
        shell: pwsh
        run: |
          if (-not $env:RDP_PASSWORD) {
            throw "Secret RDP_PASSWORD belum dibuat."
          }

          if ($env:RDP_USER -notmatch '^[a-zA-Z0-9_-]{3,20}$') {
            throw "Nama user tidak valid."
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue)) {
            New-LocalUser `
              -Name $env:RDP_USER `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:SystemCurrentControlSetControlTerminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Connect Tailscale Windows
        shell: pwsh
        run: |
          $ts = "$env:ProgramFilesTailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $installer = "$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/quiet" `
              -Wait

            Start-Sleep -Seconds 10
          }

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw "Secret TAILSCALE_AUTHKEY atau TAILSCALE_AUTH_KEY belum dibuat."
          }

          & $ts up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$env:HOSTNAME" `
            --accept-dns=true

          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Status Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          @"
          {
            "active": true,
            "platform": "windows",
            "hostname": "$env:HOSTNAME",
            "username": "$env:RDP_USER",
            "tailscale": {
              "ip": "$env:TAILSCALE_IP",
              "rdp_port": 3389
            },
            "duration_minutes": "$env:DUR"
          }
          "@ | Set-Content out/rdp-status.json

          Write-Host "========================================"
          Write-Host "WINDOWS SESI SIAP"
          Write-Host "RDP  : $env:TAILSCALE_IP`:3389"
          Write-Host "User : $env:RDP_USER"
          Write-Host "Pass : gunakan secret RDP_PASSWORD"
          Write-Host "========================================"

      - name: Publish status Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/rdp-status.json
          git commit -m "Update Windows RDP status" || $true
          git push origin HEAD:status --force

      - name: Sesi Windows aktif
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes([int]$env:DUR)

          while ((Get-Date) -lt $end) {
            Write-Host "[RdpFree] Sesi aktif - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            Start-Sleep -Seconds 60
          }

      - name: Finalize Windows
        if: always()
        shell: pwsh
        run: |
          $ts = "$env:ProgramFilesTailscale\tailscale.exe"
          if (Test-Path $ts) {
            & $ts logout
          }

          New-Item -ItemType Directory -Force -Path out | Out-Null

          @"
          {
            "active": false,
            "platform": "windows",
            "hostname": "$env:HOSTNAME",
            "message": "Sesi Windows telah selesai."
          }
          "@ | Set-Content out/rdp-status.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/rdp-status.json
          git commit -m "Finalize Windows RDP session" || $true
          git push origin HEAD:status --force
