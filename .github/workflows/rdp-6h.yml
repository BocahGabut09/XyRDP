# .github/workflows/rdpfree.yml

name: RdpFree — Linux/Windows Tailscale

on:
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: Durasi sesi dalam menit
        required: false
        default: "360"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "180"
          - "240"
          - "300"
          - "330"
          - "360"

      hostname:
        description: Hostname Tailscale
        required: false
        default: rdpfree
        type: string

      rdp_user:
        description: Username login
        required: false
        default: xyadmin
        type: string

      runner:
        description: Sistem operasi runner
        required: false
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04
          - windows-2022
          - windows-2025
          - windows-latest

      desktop:
        description: Desktop Linux
        required: false
        default: xfce
        type: choice
        options:
          - xfce
          - mate
          - lxde
          - tidak

      xrdp:
        description: Aktifkan XRDP Linux
        required: false
        default: ya
        type: choice
        options:
          - ya
          - tidak

      ssh:
        description: Aktifkan SSH
        required: false
        default: ya
        type: choice
        options:
          - ya
          - tidak

      microphone:
        description: Aktifkan audio/mikrofon Linux
        required: false
        default: ya
        type: choice
        options:
          - ya
          - tidak

permissions:
  contents: write
  actions: read

concurrency:
  group: xyrdp
  cancel-in-progress: false

jobs:
  linux:
    name: Linux Tailscale RDP/SSH
    if: startsWith(inputs.runner, 'ubuntu-')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      DUR: ${{ inputs.durasi_menit }}
      SESSION_HOSTNAME: ${{ inputs.hostname }}
      RDP_USER: ${{ inputs.rdp_user }}
      DESKTOP: ${{ inputs.desktop }}
      ENABLE_XRDP: ${{ inputs.xrdp }}
      ENABLE_SSH: ${{ inputs.ssh }}
      MICROPHONE: ${{ inputs.microphone }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cek environment Linux
        shell: bash
        run: |
          set -e
          echo "OS:"
          uname -a
          echo "Disk:"
          df -h
          echo "Runner: $RUNNER_NAME"

      - name: Validasi secret
        shell: bash
        run: |
          set -e

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "::error::Buat secret TAILSCALE_AUTHKEY atau TAILSCALE_AUTH_KEY."
            exit 1
          fi

          if [ -z "$RDP_PASSWORD" ]; then
            echo "::error::Buat secret RDP_PASSWORD."
            exit 1
          fi

          if ! [[ "$RDP_USER" =~ ^[a-zA-Z0-9_-]{3,20}$ ]]; then
            echo "::error::Username harus 3-20 karakter: huruf, angka, _ atau -."
            exit 1
          fi

      - name: Install dan connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_AUTH_KEY }}
          statedir: /tmp/tailscale-state

      - name: Set hostname Tailscale
        shell: bash
        run: |
          set -e

          sudo tailscale set \
            --hostname="$SESSION_HOSTNAME" \
            --accept-dns=true || \
          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="$SESSION_HOSTNAME" \
            --accept-dns=true \
            --accept-routes=false

          sleep 3

          TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1)"

          if [ -z "$TAILSCALE_IP" ]; then
            echo "::error::IP Tailscale tidak ditemukan."
            sudo tailscale status
            exit 1
          fi

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"
          sudo tailscale status

      - name: Buat user Linux
        shell: bash
        run: |
          set -e

          if ! id "$RDP_USER" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$RDP_USER"
          fi

          echo "$RDP_USER:$RDP_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$RDP_USER"

          sudo mkdir -p "/home/$RDP_USER"
          sudo chown -R "$RDP_USER:$RDP_USER" "/home/$RDP_USER"

      - name: Install XFCE
        if: ${{ inputs.desktop == 'xfce' }}
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            xorgxrdp

      - name: Install MATE
        if: ${{ inputs.desktop == 'mate' }}
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ubuntu-mate-desktop \
            dbus-x11 \
            xorgxrdp

      - name: Install LXDE
        if: ${{ inputs.desktop == 'lxde' }}
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxde \
            dbus-x11 \
            xorgxrdp

      - name: Konfigurasi desktop session
        if: ${{ inputs.desktop != 'tidak' }}
        shell: bash
        run: |
          set -e

          case "$DESKTOP" in
            xfce)
              START_SESSION="startxfce4"
              ;;
            mate)
              START_SESSION="mate-session"
              ;;
            lxde)
              START_SESSION="startlxde"
              ;;
            *)
              START_SESSION="startxfce4"
              ;;
          esac

          sudo tee "/home/$RDP_USER/.xsession" > /dev/null <<EOF
          #!/bin/sh
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          export XDG_CURRENT_DESKTOP=$DESKTOP
          exec $START_SESSION
          EOF

          sudo chmod +x "/home/$RDP_USER/.xsession"
          sudo chown "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.xsession"

      - name: Install dan konfigurasi XRDP
        if: ${{ inputs.xrdp == 'ya' && inputs.desktop != 'tidak' }}
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xrdp \
            xorgxrdp \
            dbus-x11

          sudo adduser xrdp ssl-cert || true

          sudo sed -i \
            's/^new_cursors=true/new_cursors=false/' \
            /etc/xrdp/xrdp.ini || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow from 100.64.0.0/10 to any port 3389 proto tcp || true
          fi

      - name: Install dan konfigurasi SSH
        if: ${{ inputs.ssh == 'ya' }}
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server

          sudo mkdir -p /run/sshd
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow from 100.64.0.0/10 to any port 22 proto tcp || true
          fi

      - name: Install audio dan mikrofon
        if: ${{ inputs.microphone == 'ya' && inputs.desktop != 'tidak' }}
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pulseaudio \
            pulseaudio-utils \
            alsa-utils

          sudo usermod -aG audio "$RDP_USER" || true

      - name: Buat status koneksi Linux
        shell: bash
        run: |
          set -e

          mkdir -p out

          cat > out/rdp-status.json <<EOF
          {
            "active": true,
            "platform": "linux",
            "hostname": "$SESSION_HOSTNAME",
            "username": "$RDP_USER",
            "desktop": "$DESKTOP",
            "xrdp": "$ENABLE_XRDP",
            "ssh": "$ENABLE_SSH",
            "microphone": "$MICROPHONE",
            "duration_minutes": "$DUR",
            "tailscale": {
              "ip": "$TAILSCALE_IP",
              "rdp": "$TAILSCALE_IP:3389",
              "ssh": "$TAILSCALE_IP:22"
            }
          }
          EOF

          echo "========================================"
          echo "LINUX SESI SIAP"
          echo "========================================"
          echo "RDP      : $TAILSCALE_IP:3389"
          echo "SSH      : $RDP_USER@$TAILSCALE_IP"
          echo "Username : $RDP_USER"
          echo "Password : gunakan secret RDP_PASSWORD"
          echo "Desktop  : $DESKTOP"
          echo "========================================"

      - name: Publish status Linux
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f out/rdp-status.json

          if git diff --cached --quiet; then
            echo "[RdpFree] Tidak ada perubahan status."
          else
            git commit -m "Update Linux RDP status"
            git push origin HEAD:status --force
          fi

      - name: Sesi Linux aktif
        shell: bash
        run: |
          set -e

          END_TIME=$(( $(date +%s) + DUR * 60 ))

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            echo "[RdpFree] Sesi aktif - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            sleep 60
          done

      - name: Finalize Linux
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          sudo systemctl stop xrdp 2>/dev/null || true
          sudo systemctl stop ssh 2>/dev/null || true
          sudo tailscale logout 2>/dev/null || true

          mkdir -p out

          cat > out/rdp-status.json <<EOF
          {
            "active": false,
            "platform": "linux",
            "hostname": "$SESSION_HOSTNAME",
            "message": "Sesi Linux telah selesai."
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f out/rdp-status.json

          if git diff --cached --quiet; then
            echo "[RdpFree] Status final tidak berubah."
          else
            git commit -m "Finalize Linux RDP session"
            git push origin HEAD:status --force
          fi

  windows:
    name: Windows Tailscale RDP
    if: startsWith(inputs.runner, 'windows-')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      DUR: ${{ inputs.durasi_menit }}
      SESSION_HOSTNAME: ${{ inputs.hostname }}
      RDP_USER: ${{ inputs.rdp_user }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validasi secret Windows
        shell: pwsh
        run: |
          if (-not $env:RDP_PASSWORD) {
            throw "Secret RDP_PASSWORD belum dibuat."
          }

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw "Secret TAILSCALE_AUTHKEY atau TAILSCALE_AUTH_KEY belum dibuat."
          }

          if ($env:RDP_USER -notmatch '^[a-zA-Z0-9_-]{3,20}$') {
            throw "Username tidak valid."
          }

      - name: Setup Windows user dan RDP
        shell: pwsh
        run: |
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          if (-not (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue)) {
            New-LocalUser `
              -Name $env:RDP_USER `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:SystemCurrentControlSetControlTerminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

      - name: Install Tailscale Windows
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale-setup.exe"
          $tailscale = "$env:ProgramFilesTailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/quiet" `
              -Wait

            Start-Sleep -Seconds 10
          }

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$env:SESSION_HOSTNAME" `
            --accept-dns=true

          Start-Sleep -Seconds 3

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if (-not $ip) {
            throw "IP Tailscale tidak ditemukan."
          }

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          & $tailscale status

      - name: Buat status koneksi Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          @"
          {
            "active": true,
            "platform": "windows",
            "hostname": "$env:SESSION_HOSTNAME",
            "username": "$env:RDP_USER",
            "duration_minutes": "$env:DUR",
            "tailscale": {
              "ip": "$env:TAILSCALE_IP",
              "rdp": "$env:TAILSCALE_IP`:3389"
            }
          }
          "@ | Set-Content out/rdp-status.json

          Write-Host "========================================"
          Write-Host "WINDOWS SESI SIAP"
          Write-Host "========================================"
          Write-Host "RDP      : $env:TAILSCALE_IP`:3389"
          Write-Host "Username : $env:RDP_USER"
          Write-Host "Password : gunakan secret RDP_PASSWORD"
          Write-Host "========================================"

      - name: Publish status Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f out/rdp-status.json

          $changed = git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[RdpFree] Tidak ada perubahan status."
          } else {
            git commit -m "Update Windows RDP status"
            git push origin HEAD:status --force
          }

      - name: Sesi Windows aktif
        shell: pwsh
        run: |
          $endTime = (Get-Date).AddMinutes([int]$env:DUR)

          while ((Get-Date) -lt $endTime) {
            Write-Host "[RdpFree] Sesi aktif - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            Start-Sleep -Seconds 60
          }

      - name: Finalize Windows
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"

          $tailscale = "$env:ProgramFilesTailscale\tailscale.exe"

          if (Test-Path $tailscale) {
            & $tailscale logout
          }

          New-Item -ItemType Directory -Force -Path out | Out-Null

          @"
          {
            "active": false,
            "platform": "windows",
            "hostname": "$env:SESSION_HOSTNAME",
            "message": "Sesi Windows telah selesai."
          }
          "@ | Set-Content out/rdp-status.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f out/rdp-status.json

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "[RdpFree] Status final tidak berubah."
          } else {
            git commit -m "Finalize Windows RDP session"
            git push origin HEAD:status --force
          }
