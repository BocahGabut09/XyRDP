name: RdpFree — Windows/Linux RDP

'on':
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: Durasi sesi dalam menit
        required: false
        default: '360'
        type: choice
        options:
          - '15'
          - '30'
          - '60'
          - '120'
          - '180'
          - '240'
          - '300'
          - '330'
          - '360'

      hostname:
        description: Hostname sesi
        required: false
        default: rdpfree
        type: string

      rdp_user:
        description: Username login
        required: false
        default: xyadmin
        type: string

      akses:
        description: Metode akses
        required: false
        default: tailscale
        type: choice
        options:
          - tailscale
          - portmap

      runner:
        description: Pilih OS runner
        required: true
        default: windows-2022
        type: choice
        options:
          - windows-2022
          - windows-2025
          - windows-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-latest

      xydesk:
        description: Setup XyDesk hanya untuk Windows
        required: false
        default: ya
        type: choice
        options:
          - ya
          - tidak

      microphone:
        description: Aktifkan mikrofon
        required: false
        default: ya
        type: choice
        options:
          - ya
          - tidak

      storage_boost:
        description: Storage boost hanya untuk Windows
        required: false
        default: tidak
        type: choice
        options:
          - ya
          - tidak

      debloat:
        description: Debloat hanya untuk Windows
        required: false
        default: ringan
        type: choice
        options:
          - ringan
          - full
          - tidak

      samp:
        description: Dependensi SAMP hanya untuk Windows
        required: false
        default: tidak
        type: choice
        options:
          - ya
          - tidak

      win10:
        description: Tweak Windows
        required: false
        default: tidak
        type: choice
        options:
          - ya
          - tidak

      ekstra:
        description: Ekstra Windows
        required: false
        default: tidak
        type: choice
        options:
          - ya
          - tidak

      grafis:
        description: GPU software Windows
        required: false
        default: tidak
        type: choice
        options:
          - software
          - tidak

      roblox:
        description: Cek kompatibilitas Roblox
        required: false
        default: tidak
        type: choice
        options:
          - ya
          - tidak

      minecraft_java:
        description: Cek Minecraft Java
        required: false
        default: tidak
        type: choice
        options:
          - ya
          - tidak

      minecraft_bedrock:
        description: Cek Minecraft Bedrock
        required: false
        default: tidak
        type: choice
        options:
          - ya
          - tidak

      portmap_host:
        description: Host Portmap
        required: false
        default: ''
        type: string

      portmap_port:
        description: Port Portmap
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: xyrdp
  cancel-in-progress: false

jobs:
  rdp-windows:
    if: startsWith(inputs.runner, 'windows')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      DUR: ${{ inputs.durasi_menit }}
      HOSTNAME: ${{ inputs.hostname }}
      RDP_USER: ${{ inputs.rdp_user }}
      AKSES: ${{ inputs.akses }}
      XYDESK: ${{ inputs.xydesk }}
      WIN10: ${{ inputs.win10 }}
      EXTRAS: ${{ inputs.ekstra }}
      GRAFIS: ${{ inputs.grafis }}
      STORAGE_BOOST: ${{ inputs.storage_boost }}
      DEBLOAT: ${{ inputs.debloat }}
      SAMP: ${{ inputs.samp }}
      MICROPHONE: ${{ inputs.microphone }}
      ROBLOX: ${{ inputs.roblox }}
      MINECRAFT_JAVA: ${{ inputs.minecraft_java }}
      MINECRAFT_BEDROCK: ${{ inputs.minecraft_bedrock }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      PORTMAP_HOST: ${{ inputs.portmap_host || vars.PORTMAP_HOST }}
      PORTMAP_PORT: ${{ inputs.portmap_port || vars.PORTMAP_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Info lingkungan Windows
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption)"
          Write-Host "Version: $($os.Version)"
          Get-CimInstance Win32_LogicalDisk |
            ForEach-Object {
              Write-Host "$($_.DeviceID): $([math]::Round($_.FreeSpace / 1GB, 1)) GB free"
            }

      - name: Setup dasar Windows RDP
        shell: pwsh
        run: ./scripts/setup-rdp.ps1

      - name: Setup XyDesk Windows
        if: ${{ inputs.xydesk == 'ya' }}
        shell: pwsh
        run: ./scripts/setup-xydesk.ps1

      - name: Setup Tailscale Windows
        if: ${{ inputs.akses == 'tailscale' }}
        shell: pwsh
        run: ./scripts/setup-akses.ps1

      - name: Setup Portmap Windows
        if: ${{ inputs.akses == 'portmap' }}
        shell: pwsh
        env:
          PORTMAP_OVPN_CONFIG: ${{ secrets.PORTMAP_OVPN_CONFIG }}
        run: ./scripts/setup-portmap.ps1

      - name: Setup media Windows
        shell: pwsh
        run: ./scripts/setup-media.ps1

      - name: Storage boost Windows
        if: ${{ inputs.storage_boost == 'ya' }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/optimize-storage.ps1

      - name: Tweak Windows
        if: ${{ inputs.win10 == 'ya' }}
        shell: pwsh
        run: ./scripts/setup-win10.ps1

      - name: Setup grafis Windows
        if: ${{ inputs.grafis == 'software' }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/setup-grafis.ps1

      - name: Setup ekstra Windows
        if: ${{ inputs.ekstra == 'ya' }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/setup-extras.ps1

      - name: Setup SAMP Windows
        if: ${{ inputs.samp == 'ya' }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/setup-samp.ps1

      - name: Setup game Windows
        shell: pwsh
        run: ./scripts/setup-games.ps1

      - name: Publish Windows aktif
        shell: pwsh
        run: ./scripts/publish-status.ps1 -Active $true

      - name: Keepalive Windows
        shell: pwsh
        run: ./scripts/keepalive.ps1

      - name: Finalize Windows
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/publish-status.ps1 -Active $false
          ./scripts/finalize-rdp.ps1
          ./scripts/cleanup-actions.ps1

  rdp-linux:
    if: startsWith(inputs.runner, 'ubuntu')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      DUR: ${{ inputs.durasi_menit }}
      HOSTNAME: ${{ inputs.hostname }}
      RDP_USER: ${{ inputs.rdp_user }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Info lingkungan Linux
        shell: bash
        run: |
          uname -a
          lsb_release -a || true
          df -h

      - name: Install desktop dan XRDP
        shell: bash
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            curl

          echo "startxfce4" | sudo tee /etc/skel/.xsession
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Buat user Linux
        shell: bash
        run: |
          if [[ ! "$RDP_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]{2,19}$ ]]; then
            echo "Username tidak valid."
            exit 1
          fi

          if id "$RDP_USER" >/dev/null 2>&1; then
            sudo userdel -r "$RDP_USER" || true
          fi

          PASSWORD="$(tr -dc 'A-Za-z0-9!@#%+=' </dev/urandom | head -c 20)"

          sudo useradd -m -s /bin/bash "$RDP_USER"
          echo "$RDP_USER:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$RDP_USER"

          echo "::add-mask::$PASSWORD"
          echo "LINUX_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Install Tailscale Linux
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="linux-rdp-${GITHUB_RUN_ID}"

          IP="$(sudo tailscale ip -4 | head -n 1)"

          if [[ ! "$IP" =~ ^[0-9]+.[0-9]+.[0-9]+.[0-9]+$ ]]; then
            echo "IP Tailscale tidak ditemukan."
            exit 1
          fi

          echo "::add-mask::$IP"
          echo "LINUX_IP=$IP" >> "$GITHUB_ENV"

      - name: Kirim akses Linux ke Telegram
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="Linux RDP AKTIF

          OS: ${{ inputs.runner }}
          IP: $LINUX_IP
          Username: $RDP_USER
          Password: $LINUX_PASSWORD
          Port: 3389"

          curl -fsS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Keepalive Linux
        shell: bash
        run: |
          while true; do
            sleep 300
          done

      - name: Finalize Linux
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          sudo systemctl stop xrdp || true
          sudo tailscale logout || true
